[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mlrca"
version = "0.1.0"
description = "Agentic RAG system for diagnosing production ML failures"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.8",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mlrca = "mlrca.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
